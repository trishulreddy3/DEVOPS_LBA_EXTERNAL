<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Lab - Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Student Registration Form</h2>
        <p class="subtitle">DevOps Lab Experiment 3</p>

        <div id="statusMessage" class="status-msg"></div>

        <form id="registrationForm" onsubmit="return handleFormSubmit(event)">
            <div class="form-group">
                <label for="fullName">Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter student full name" required>
                <small class="error-text" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="student@university.edu" required>
                <small class="error-text" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" required>
                <small class="error-text" id="phoneError"></small>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth <span class="required">*</span></label>
                <input type="date" id="dob" name="dob" required>
                <small class="error-text" id="dobError"></small>
            </div>

            <div class="form-group">
                <label for="gender">Gender <span class="required">*</span></label>
                <select id="gender" name="gender" required>
                    <option value="">-- Select Gender --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <small class="error-text" id="genderError"></small>
            </div>

            <div class="form-group">
                <label for="course">Course / Department <span class="required">*</span></label>
                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Artificial Intelligence & Data Science">AI & Data Science</option>
                    <option value="Electronics & Communication">Electronics & Communication</option>
                </select>
                <small class="error-text" id="courseError"></small>
            </div>

            <div class="button-group">
                <button type="submit" id="submitBtn" class="btn btn-primary">Register Student</button>
                <button type="button" id="resetBtn" class="btn btn-secondary" onclick="resetForm()">Reset</button>
            </div>
        </form>

        <div class="records-container" id="recordsSection" style="display: none;">
            <h3>Registered Students</h3>
            <table id="recordsTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Gender</th>
                        <th>Course</th>
                    </tr>
                </thead>
                <tbody id="recordsBody"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
