apiVersion: apps/v1
kind: Deployment
metadata:
  name: arithmetic-app-deployment
  labels:
    app: arithmetic-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arithmetic-app
  template:
    metadata:
      labels:
        app: arithmetic-app
    spec:
      containers:
      - name: arithmetic-container
        image: arithmetic-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "250m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
